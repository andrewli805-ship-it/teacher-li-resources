<main class="main">
  <p id="aigame-loading" class="muted" data-i18n="portal.loading">載入中…</p>
  <div id="aigame-app" hidden>
    <p><a class="text-link" href="../gallery/ict-2627-2h/" data-i18n="aigame.viewPublic">查看公眾展覽 →</a></p>
    <p id="aigame-error" class="form-error" hidden role="alert"></p>
    <p id="aigame-ok" class="form-ok" hidden role="status"></p>

    <section id="aigame-teacher" class="content-panel" hidden>
      <h2 data-i18n="portal.teacher.assignments">作業設定</h2>
      <form id="aigame-settings" class="form-grid">
        <div class="field">
          <label for="aigame-due" data-i18n="portal.assign.due">截止日期</label>
          <input id="aigame-due" type="datetime-local" />
        </div>
        <div class="field">
          <label for="aigame-factor" data-i18n="portal.assign.factor">遲交分數倍數</label>
          <input id="aigame-factor" type="number" min="0" max="1" step="0.05" value="0.8" required />
        </div>
        <label class="check-field span-2">
          <input id="aigame-late" type="checkbox" checked />
          <span data-i18n="portal.assign.acceptLate">接受遲交</span>
        </label>
        <p class="muted span-2" data-i18n="portal.assign.hk">香港時間</p>
        <div class="span-2 actions">
          <button id="aigame-settings-save" class="btn-enter" type="submit" data-i18n="portal.assign.save">儲存作業</button>
          <button id="aigame-export" class="btn-ghost" type="button" data-i18n="aigame.export">匯出</button>
        </div>
      </form>
      <p id="aigame-progress" class="muted"></p>
    </section>

    <section id="aigame-form-panel" class="content-panel">
      <p id="aigame-timing" class="aigame-status" hidden></p>
      <form id="aigame-form" class="form-grid" autocomplete="off">
        <div class="field">
          <label for="aigame-year" data-i18n="aigame.field.year">年份</label>
          <input id="aigame-year" type="number" inputmode="numeric" min="2000" max="9999" step="1" value="2627" required />
        </div>
        <div class="field">
          <label for="aigame-class" data-i18n="aigame.field.class">班級</label>
          <input id="aigame-class" value="2H" readonly />
        </div>
        <div class="field">
          <label for="aigame-no" data-i18n="aigame.field.studentNo">學號</label>
          <input id="aigame-no" type="number" inputmode="numeric" min="1" max="99" step="1" required />
        </div>
        <div class="field">
          <label for="aigame-name" data-i18n="aigame.field.name">姓名</label>
          <input id="aigame-name" type="text" maxlength="80" required />
        </div>
        <div class="field span-2">
          <label for="aigame-url" data-i18n="aigame.field.url">AI遊戲網頁連結</label>
          <input id="aigame-url" type="url" maxlength="2000" placeholder="https://" required />
        </div>
        <div class="span-2 actions">
          <button id="aigame-submit" class="btn-enter" type="submit">提交</button>
          <button id="aigame-cancel" class="btn-ghost" type="button" hidden data-i18n="aigame.cancel">取消</button>
        </div>
      </form>
    </section>

    <section class="content-panel">
      <div class="exhibit-toolbar">
        <label class="sr-only" for="aigame-search" data-i18n="gallery.searchPh">搜尋姓名或座號</label>
        <input id="aigame-search" type="search" data-i18n-placeholder="gallery.searchPh" placeholder="搜尋姓名或座號" />
        <label class="sr-only" for="aigame-sort" data-i18n="gallery.sortSeat">座號</label>
        <select id="aigame-sort">
          <option value="seat" selected data-i18n="gallery.sortSeat">座號</option>
          <option value="newest" data-i18n="gallery.sortNew">最新繳交</option>
        </select>
      </div>
      <p id="aigame-empty" class="exhibit-empty" hidden data-i18n="gallery.empty">尚未有作品</p>
      <div id="aigame-grid" class="exhibit-grid"></div>
    </section>
  </div>
</main>
