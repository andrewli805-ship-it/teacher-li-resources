<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2627 2H 班 · AI 小遊戲作品展覽館</title>
  <meta name="description" content="2627 2H 班 AI 小遊戲作品展覽館。座號 1–40 提交姓名及遊戲連結。" />
  <!-- Class 2627 2H. Submissions use localStorage key ai_game_submissions_2h. Do not add Google Sites edit URLs. -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '"Segoe UI"',
              '"PingFang TC"',
              '"Microsoft JhengHei"',
              '"Noto Sans TC"',
              "Arial",
              "sans-serif",
            ],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
  </style>
  <script>
    window.AI_GAME_CONFIG = {
      storageKey: "ai_game_submissions_2h",
      csvPrefix: "AI_Game_Submissions_2627_2H",
      labelZh: "2627 2H 班",
      labelEn: "Class 2627 2H",
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans">
  <noscript>
    <p>此頁需要 JavaScript 才能提交及顯示作品。請開啟瀏覽器的 JavaScript。</p>
  </noscript>

  <div class="max-w-7xl mx-auto space-y-8">
    <div class="flex justify-between items-center border-b border-slate-200 pb-3 gap-3 flex-wrap">
      <a id="backLink" href="ict.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">← 返回 ICT 交功課</a>
      <div class="flex items-center gap-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl" aria-hidden="true">🌐</span>
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Language / 語言:</span>
        </div>
        <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 shadow-sm" role="group" aria-label="Language">
          <button type="button" id="langZhBtn" onclick="setLanguage('zh')" aria-pressed="true" class="px-3 py-1 text-xs font-bold rounded-md transition-colors bg-indigo-600 text-white">
            繁體中文
          </button>
          <button type="button" id="langEnBtn" onclick="setLanguage('en')" aria-pressed="false" class="px-3 py-1 text-xs font-bold rounded-md transition-colors text-slate-600 hover:text-indigo-600">
            English
          </button>
        </div>
      </div>
    </div>

    <header class="text-center space-y-3">
      <h1 id="appTitle" class="text-3xl md:text-4xl font-extrabold text-indigo-600 tracking-tight">
        🎮 AI 小遊戲作品展覽館
      </h1>
      <p id="classLabel" class="inline-flex items-center rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1 text-xs font-bold tracking-wide">2627 2H 班</p>
      <p id="appSubtitle" class="text-slate-600 max-w-2xl mx-auto text-sm md:text-base">
        請同學們輸入自己的座號、姓名及 AI 遊戲網頁連結。若需修改資料，只需點擊卡片上的「修改資料」或重新輸入該座號送出即可！
      </p>
      <p id="storageNote" class="text-xs text-slate-500 max-w-2xl mx-auto">
        資料只儲存在這部瀏覽器。換電腦、換瀏覽器或清除網站資料後便會消失，請使用同一瀏覽器查看及匯出。
      </p>

      <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-sm border border-slate-200 mt-4 space-y-2">
        <div class="flex justify-between text-xs font-semibold text-slate-600">
          <span id="progressLabel">全班繳交進度</span>
          <span id="progressText">0 / 40 人 (0%)</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
          <div id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0" class="bg-indigo-600 h-full transition-all duration-500 w-0"></div>
        </div>
      </div>
    </header>

    <section id="formSection" class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 transition-all duration-300">
      <div class="flex justify-between items-center mb-4 border-b pb-3 gap-3">
        <div class="flex items-center">
          <h2 id="formHeading" class="text-xl font-bold text-slate-700">📝 學生提交表單</h2>
          <span id="editingBadge" class="hidden ml-3 bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">修改模式</span>
        </div>
        <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-3 py-1.5 rounded-lg transition">
          ✕ 取消修改
        </button>
      </div>

      <form id="submitForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <label id="lblSeat" for="studentNo" class="block text-xs font-bold text-slate-600 mb-1">座號 (1-40)</label>
          <input type="number" id="studentNo" min="1" max="40" step="1" required
            class="w-full px-4 py-2 text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" />
        </div>
        <div>
          <label id="lblName" for="studentName" class="block text-xs font-bold text-slate-600 mb-1">學生姓名</label>
          <input type="text" id="studentName" required maxlength="80"
            class="w-full px-4 py-2 text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" />
        </div>
        <div class="sm:col-span-2">
          <label id="lblUrl" for="gameUrl" class="block text-xs font-bold text-slate-600 mb-1">AI 遊戲網頁連結 (URL)</label>
          <div class="flex gap-2">
            <input type="url" id="gameUrl" required
              class="w-full px-4 py-2 text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" />
            <button type="submit" id="submitBtn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-xl shadow-sm transition shrink-0">
              提交
            </button>
          </div>
        </div>
      </form>
    </section>

    <section class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex flex-wrap items-center gap-3">
        <input type="text" id="searchInput" oninput="applyFilters()"
          class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-52" />
        <select id="statusFilter" onchange="applyFilters()" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all" id="optAll">顯示全部 (40位)</option>
          <option value="submitted" id="optSubmitted">僅顯示已繳交</option>
          <option value="unsubmitted" id="optUnsubmitted">僅顯示未繳交</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" id="btnExport" onclick="exportData()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-lg text-xs md:text-sm transition shadow-sm flex items-center justify-center gap-1.5">
          📋 <span id="btnExportText">複製 / 匯出 Excel 清單</span>
        </button>
      </div>
    </section>

    <section aria-label="Student seats">
      <div id="gridContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </section>
  </div>

  <div id="exportModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="exportModalTitle" class="font-bold text-slate-800 text-base">📋 學生作品連結清單</h3>
        <button type="button" onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg px-2" aria-label="關閉">✕</button>
      </div>
      <p id="exportModalDesc" class="text-xs text-slate-600">請點擊下方「下載 Excel CSV 檔」或直接全選下方文字複製到 Excel：</p>
      <textarea id="exportTextarea" readonly class="w-full h-48 p-3 text-xs font-mono bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none select-all"></textarea>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="btnDownloadCsv" onclick="downloadCsvFile()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
          ⬇️ 下載 Excel CSV 檔
        </button>
        <button type="button" id="btnCloseExport" onclick="closeExportModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition">
          關閉
        </button>
      </div>
    </div>
  </div>

  <script src="ai-game.js"></script>
</body>
</html>
